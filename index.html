<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Makes the game fit properly on mobile screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch the Falling Stars</title>


    <style>

        /* =========================
           PAGE
           ========================= */

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            background: #080b16;

            color: white;

            font-family: Arial, sans-serif;

            text-align: center;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        /* =========================
           GAME CONTAINER
           ========================= */

        .game-container {

            width: 100%;

            max-width: 850px;

            padding: 10px;

        }


        /* =========================
           TITLE
           ========================= */

        h1 {

            color: #ffd84d;

            font-size: clamp(24px, 6vw, 40px);

            margin: 10px 0 15px;

            text-shadow: 0 0 10px #ffd84d;

        }


        /* =========================
           SCORE AND LIVES
           ========================= */

        .game-info {

            display: flex;

            justify-content: center;

            gap: 60px;

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        #score {

            color: #ffd84d;

        }


        #lives {

            color: #ff6677;

        }


        /* =========================
           CANVAS
           ========================= */

        canvas {

            display: block;

            width: 100%;

            max-width: 800px;

            height: auto;

            margin: auto;

            background: #10162b;

            border: 2px solid #ffd84d;

            border-radius: 10px;

            touch-action: none;

        }


        /* =========================
           INSTRUCTIONS
           ========================= */

        .instructions {

            color: #9da6c7;

            font-size: 14px;

            margin-top: 12px;

        }


        /* =========================
           GAME OVER
           ========================= */

        #gameOver {

            display: none;

            position: fixed;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            width: 85%;

            max-width: 400px;

            background: #11182e;

            padding: 35px 20px;

            border: 2px solid #ffd84d;

            border-radius: 15px;

            box-shadow: 0 0 30px rgba(255, 216, 77, 0.4);

        }


        #gameOver h2 {

            color: #ff6677;

            font-size: 38px;

            margin-top: 0;

        }


        #gameOver p {

            font-size: 20px;

        }


        /* =========================
           PLAY AGAIN BUTTON
           ========================= */

        button {

            background: #ffd84d;

            color: #111;

            border: none;

            padding: 13px 28px;

            border-radius: 8px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #ffe88a;

        }


        /* =========================
           MOBILE DESIGN
           ========================= */

        @media (max-width: 600px) {

            body {

                align-items: flex-start;

            }


            .game-container {

                padding: 8px;

            }


            h1 {

                margin-top: 10px;

                margin-bottom: 10px;

            }


            .game-info {

                gap: 35px;

                font-size: 17px;

                margin-bottom: 10px;

            }


            .instructions {

                font-size: 13px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================
         MAIN GAME CONTAINER
         ================================= -->

    <div class="game-container">


        <!-- Game title -->

        <h1>
            ⭐ CATCH THE FALLING STARS ⭐
        </h1>


        <!-- Score and lives -->

        <div class="game-info">

            <div>

                Score:

                <span id="score">
                    0
                </span>

            </div>


            <div>

                Lives:

                <span id="lives">
                    3
                </span>

                ❤️

            </div>

        </div>


        <!-- Game screen -->

        <canvas
            id="gameCanvas"
            width="800"
            height="600">
        </canvas>


        <!-- Instructions -->

        <div class="instructions">

            💻 Use ← → keys &nbsp; | &nbsp;
            🖱️ Mouse &nbsp; | &nbsp;
            📱 Drag your finger

        </div>


    </div>


    <!-- =================================
         GAME OVER SCREEN
         ================================= -->

    <div id="gameOver">

        <h2>
            GAME OVER
        </h2>


        <p>

            Final Score:

            <span id="finalScore">
                0
            </span>

        </p>


        <button id="playAgain">

            🔄 Play Again

        </button>

    </div>


    <!-- =================================
         JAVASCRIPT
         ================================= -->

    <script>


        // ==========================================
        // 1. GET HTML ELEMENTS
        // ==========================================

        const canvas =
            document.getElementById("gameCanvas");


        const ctx =
            canvas.getContext("2d");


        const scoreElement =
            document.getElementById("score");


        const livesElement =
            document.getElementById("lives");


        const gameOverElement =
            document.getElementById("gameOver");


        const finalScoreElement =
            document.getElementById("finalScore");


        const playAgainButton =
            document.getElementById("playAgain");


        // ==========================================
        // 2. GAME VARIABLES
        // ==========================================

        let score = 0;

        let lives = 3;

        let gameRunning = true;

        let fallingSpeed = 2.5;

        let lastTime = 0;

        let starTimer = 0;


        // ==========================================
        // 3. BASKET
        // ==========================================

        const basket = {

            x: 350,

            y: 540,

            width: 100,

            height: 30,

            speed: 7

        };


        // ==========================================
        // 4. KEYBOARD VARIABLES
        // ==========================================

        let leftPressed = false;

        let rightPressed = false;


        // ==========================================
        // 5. STARS ARRAY
        // ==========================================

        let stars = [];


        // ==========================================
        // 6. CREATE STAR
        // ==========================================

        function createStar() {

            const star = {

                x:
                    Math.random() *
                    (canvas.width - 30) +
                    15,

                y: -20,

                size: 15,

                speed:
                    fallingSpeed +
                    Math.random(),

                rotation: 0

            };


            stars.push(star);

        }


        // ==========================================
        // 7. DRAW STAR
        // ==========================================

        function drawStar(star) {

            ctx.save();


            // Move to star position

            ctx.translate(
                star.x,
                star.y
            );


            // Rotate the star

            ctx.rotate(
                star.rotation
            );


            // Star color

            ctx.fillStyle =
                "#ffd84d";


            // Star glow

            ctx.shadowColor =
                "#ffd84d";

            ctx.shadowBlur =
                15;


            // Start drawing star

            ctx.beginPath();


            // A star has 10 points

            for (
                let i = 0;
                i < 10;
                i++
            ) {

                let radius;


                // Outer point

                if (i % 2 === 0) {

                    radius =
                        star.size;

                }

                // Inner point

                else {

                    radius =
                        star.size * 0.4;

                }


                const angle =
                    -Math.PI / 2 +
                    i * Math.PI / 5;


                const x =
                    Math.cos(angle) *
                    radius;


                const y =
                    Math.sin(angle) *
                    radius;


                if (i === 0) {

                    ctx.moveTo(
                        x,
                        y
                    );

                }

                else {

                    ctx.lineTo(
                        x,
                        y
                    );

                }

            }


            ctx.closePath();

            ctx.fill();


            ctx.restore();

        }


        // ==========================================
        // 8. DRAW BASKET
        // ==========================================

        function drawBasket() {

            ctx.fillStyle =
                "#55dfff";


            ctx.shadowColor =
                "#55dfff";


            ctx.shadowBlur =
                10;


            ctx.fillRect(

                basket.x,

                basket.y,

                basket.width,

                basket.height

            );


            ctx.shadowBlur = 0;

        }


        // ==========================================
        // 9. UPDATE BASKET
        // ==========================================

        function updateBasket() {


            // Move left

            if (leftPressed) {

                basket.x =
                    basket.x -
                    basket.speed;

            }


            // Move right

            if (rightPressed) {

                basket.x =
                    basket.x +
                    basket.speed;

            }


            // Stop at left edge

            if (basket.x < 0) {

                basket.x = 0;

            }


            // Stop at right edge

            if (
                basket.x +
                basket.width >
                canvas.width
            ) {

                basket.x =
                    canvas.width -
                    basket.width;

            }

        }


        // ==========================================
        // 10. UPDATE STARS
        // ==========================================

        function updateStars() {


            // Start from last star

            for (
                let i = stars.length - 1;
                i >= 0;
                i--
            ) {

                const star =
                    stars[i];


                // Move star downward

                star.y =
                    star.y +
                    star.speed;


                // Rotate star

                star.rotation += 0.03;


                // ==================================
                // CHECK IF STAR IS CAUGHT
                // ==================================

                if (

                    star.y +
                    star.size >=
                    basket.y

                    &&

                    star.y -
                    star.size <=
                    basket.y +
                    basket.height

                    &&

                    star.x >=
                    basket.x

                    &&

                    star.x <=
                    basket.x +
                    basket.width

                ) {


                    // Remove star

                    stars.splice(i, 1);


                    // Increase score

                    score++;


                    scoreElement.textContent =
                        score;


                    // Increase speed every 10 points

                    if (
                        score % 10 === 0
                    ) {

                        fallingSpeed += 0.4;

                    }


                    continue;

                }


                // ==================================
                // CHECK IF STAR IS MISSED
                // ==================================

                if (
                    star.y -
                    star.size >
                    canvas.height
                ) {


                    // Remove star

                    stars.splice(i, 1);


                    // Lose one life

                    lives--;


                    livesElement.textContent =
                        lives;


                    // Check Game Over

                    if (lives <= 0) {

                        endGame();

                    }

                }

            }

        }


        // ==========================================
        // 11. DRAW EVERYTHING
        // ==========================================

        function draw() {


            // Clear the canvas

            ctx.clearRect(

                0,

                0,

                canvas.width,

                canvas.height

            );


            // Draw stars

            for (
                const star of stars
            ) {

                drawStar(star);

            }


            // Draw basket

            drawBasket();

        }


        // ==========================================
        // 12. MAIN GAME LOOP
        // ==========================================

        function gameLoop(currentTime) {


            // Stop when game ends

            if (!gameRunning) {

                return;

            }


            // Calculate time

            const deltaTime =
                currentTime -
                lastTime;


            lastTime =
                currentTime;


            // Update basket

            updateBasket();


            // Update stars

            updateStars();


            // Create stars

            starTimer +=
                deltaTime;


            if (
                starTimer > 700
            ) {

                createStar();

                starTimer = 0;

            }


            // Draw game

            draw();


            // Run game loop again

            requestAnimationFrame(
                gameLoop
            );

        }


        // ==========================================
        // 13. KEYBOARD - KEY DOWN
        // ==========================================

        document.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    leftPressed = true;

                    event.preventDefault();

                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    rightPressed = true;

                    event.preventDefault();

                }

            }
        );


        // ==========================================
        // 14. KEYBOARD - KEY UP
        // ==========================================

        document.addEventListener(
            "keyup",
            function(event) {


                if (
                    event.key ===
                    "ArrowLeft"
                ) {

                    leftPressed = false;

                }


                if (
                    event.key ===
                    "ArrowRight"
                ) {

                    rightPressed = false;

                }

            }
        );


        // ==========================================
        // 15. MOUSE CONTROL
        // ==========================================

        canvas.addEventListener(
            "mousemove",
            function(event) {


                if (!gameRunning) {

                    return;

                }


                const rectangle =
                    canvas.getBoundingClientRect();


                // Convert mouse position
                // to canvas position

                const mouseX =
                    (
                        event.clientX -
                        rectangle.left
                    )
                    *
                    (
                        canvas.width /
                        rectangle.width
                    );


                // Move basket

                basket.x =
                    mouseX -
                    basket.width / 2;


                // Keep inside left edge

                if (
                    basket.x < 0
                ) {

                    basket.x = 0;

                }


                // Keep inside right edge

                if (
                    basket.x +
                    basket.width >
                    canvas.width
                ) {

                    basket.x =
                        canvas.width -
                        basket.width;

                }

            }
        );


        // ==========================================
        // 16. MOBILE TOUCH CONTROL
        // ==========================================

        canvas.addEventListener(
            "touchmove",
            function(event) {


                if (!gameRunning) {

                    return;

                }


                // Get the first finger

                const touch =
                    event.touches[0];


                const rectangle =
                    canvas.getBoundingClientRect();


                // Convert finger position
                // to canvas position

                const touchX =
                    (
                        touch.clientX -
                        rectangle.left
                    )
                    *
                    (
                        canvas.width /
                        rectangle.width
                    );


                // Move basket

                basket.x =
                    touchX -
                    basket.width / 2;


                // Left boundary

                if (
                    basket.x < 0
                ) {

                    basket.x = 0;

                }


                // Right boundary

                if (
                    basket.x +
                    basket.width >
                    canvas.width
                ) {

                    basket.x =
                        canvas.width -
                        basket.width;

                }


                // Prevent page scrolling

                event.preventDefault();

            },
            {
                passive: false
            }
        );


        // ==========================================
        // 17. GAME OVER
        // ==========================================

        function endGame() {


            gameRunning = false;


            // Show final score

            finalScoreElement.textContent =
                score;


            // Show Game Over screen

            gameOverElement.style.display =
                "block";

        }


        // ==========================================
        // 18. RESTART GAME
        // ==========================================

        function restartGame() {


            // Reset score

            score = 0;


            // Reset lives

            lives = 3;


            // Reset speed

            fallingSpeed = 2.5;


            // Remove all stars

            stars = [];


            // Reset timer

            starTimer = 0;


            // Reset basket

            basket.x = 350;


            // Update screen

            scoreElement.textContent =
                score;


            livesElement.textContent =
                lives;


            // Hide Game Over

            gameOverElement.style.display =
                "none";


            // Start game

            gameRunning = true;


            // Reset time

            lastTime =
                performance.now();


            // Start game loop

            requestAnimationFrame(
                gameLoop
            );

        }


        // ==========================================
        // 19. PLAY AGAIN BUTTON
        // ==========================================

        playAgainButton.addEventListener(
            "click",
            restartGame
        );


        // ==========================================
        // 20. START GAME
        // ==========================================

        requestAnimationFrame(
            gameLoop
        );


    </script>

</body>

</html>
